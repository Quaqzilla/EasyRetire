spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Render sets PORT; locally this falls back to 8080
server.port=${PORT:8080}

# RISE resubmit API (set RISE_TOKEN as an environment variable, never in this file)
rise.resubmit-url=${RISE_RESUBMIT_URL:https://api.rise.co.za/resubmit-claim-tax-file}
rise.resubmit-method=${RISE_RESUBMIT_METHOD:POST}
rise.token=${RISE_TOKEN:}